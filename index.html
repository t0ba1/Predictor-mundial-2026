<script>
    // --- DICCIONARIO MAESTRO DE TRADUCCIÓN (48 SELECCIONES) --- //
    const traducirMundial = {
        "Alemania": "Germany", "Arabia Saudita": "Saudi Arabia", "Argelia": "Algeria",
        "Australia": "Australia", "Austria": "Austria", "Bélgica": "Belgium",
        "Bosnia y Herzegovina": "Bosnia and Herzegovina", "Brasil": "Brazil",
        "Cabo Verde": "Cape Verde", "Canadá": "Canada", "Chequia": "Czech Republic",
        "Colombia": "Colombia", "Corea del Sur": "South Korea", "Costa de Marfil": "Ivory Coast",
        "Croacia": "Croatia", "Curazao": "Curaçao", "Ecuador": "Ecuador", "Egipto": "Egypt",
        "Escocia": "Scotland", "España": "Spain", "Estados Unidos": "United States",
        "Francia": "France", "Ghana": "Ghana", "Haití": "Haiti", "Inglaterra": "England",
        "Irak": "Iraq", "Irán": "Iran", "Japón": "Japan", "Jordania": "Jordan",
        "Marruecos": "Morocco", "México": "Mexico", "Noruega": "Norway",
        "Nueva Zelanda": "New Zealand", "Países Bajos": "Netherlands", "Panamá": "Panama",
        "Paraguay": "Paraguay", "Portugal": "Portugal", "Qatar": "Qatar",
        "RD Congo": "Congo", "Senegal": "Senegal", "Sudáfrica": "South Africa",
        "Suecia": "Sweden", "Suiza": "Switzerland", "Túnez": "Tunisia", 
        "Turquía": "Turkey", "Uruguay": "Uruguay", "Uzbekistán": "Uzbekistan"
    };

    // --- 1. EXTRACCIÓN AUTOMATIZADA DE DATOS --- //
    async function rasparELO(equipo) {
        let eq_EN = traducirMundial[equipo] || equipo;

        try {
            const urlWiki = `https://en.wikipedia.org/w/api.php?action=parse&page=World_Football_Elo_Ratings&prop=text&format=json&origin=*`;
            const respuesta = await fetch(urlWiki);
            const data = await respuesta.json();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.parse.text['*'], 'text/html');
            const celdas = Array.from(doc.querySelectorAll('td'));
            
            for (let i = 0; i < celdas.length; i++) {
                if (celdas[i].textContent.trim() === eq_EN || celdas[i].textContent.includes(eq_EN)) {
                    let puntaje1 = celdas[i+1]?.textContent.replace(/\D/g, '');
                    let puntaje2 = celdas[i+2]?.textContent.replace(/\D/g, '');
                    
                    if (puntaje1 && puntaje1.length === 4) return parseInt(puntaje1);
                    if (puntaje2 && puntaje2.length === 4) return parseInt(puntaje2);
                }
            }
            throw new Error("No encontrado en la tabla principal");
        } catch (error) {
            console.warn(`Fallback activado para ${equipo}`);
            const baseSegura = {
                "Alemania": 1980, "Arabia Saudita": 1740, "Argelia": 1820, "Argentina": 2140, "Australia": 1850,
                "Austria": 1860, "Bélgica": 1970, "Bosnia y Herzegovina": 1670, "Brasil": 2080, "Cabo Verde": 1730,
                "Canadá": 1750, "Chequia": 1800, "Colombia": 2005, "Corea del Sur": 1880, "Costa de Marfil": 1760, 
                "Croacia": 1990, "Curazao": 1600, "Ecuador": 1950, "Egipto": 1790, "Escocia": 1780, "España": 2030,
                "Estados Unidos": 1900, "Francia": 2105, "Ghana": 1680, "Haití": 1610, "Inglaterra": 2040,
                "Irak": 1660, "Irán": 1870, "Japón": 1930, "Jordania": 1640, "Marruecos": 1910,
                "México": 1890, "Noruega": 1830, "Nueva Zelanda": 1650, "Países Bajos": 2020, "Panamá": 1690,
                "Paraguay": 1710, "Portugal": 2015, "Qatar": 1630, "RD Congo": 1620, "Senegal": 1920, 
                "Sudáfrica": 1720, "Suecia": 1840, "Suiza": 1940, "Túnez": 1770, "Turquía": 1810, 
                "Uruguay": 2000, "Uzbekistán": 1700
            };
            return baseSegura[equipo] || 1750;
        }
    }

    async function extraerDatos(eqA, eqB) {
        const eloA = await rasparELO(eqA);
        const eloB = await rasparELO(eqB);

        let eqA_EN = traducirMundial[eqA] || eqA;
        let eqB_EN = traducirMundial[eqB] || eqB;

        let mktLocal, mktEmpate, mktVisit;
        
        try {
            const urlReal = `https://gamma-api.polymarket.com/events?search=${encodeURIComponent(eqA_EN)}`;
            const urlProxy = `https://api.allorigins.win/get?url=${encodeURIComponent(urlReal)}`;
            
            const respuesta = await fetch(urlProxy);
            const dataWrap = await respuesta.json();
            const data = JSON.parse(dataWrap.contents); 
            
            const mercado = data.find(evento => evento.title.includes(eqB_EN));
            
            if (mercado && mercado.markets && mercado.markets.length > 0) {
                let tokens = mercado.markets[0].outcomePrices;
                if (typeof tokens === 'string') tokens = JSON.parse(tokens);
                mktLocal = parseFloat(tokens[0]); mktEmpate = parseFloat(tokens[1]); mktVisit = parseFloat(tokens[2]);
            } else {
                throw new Error("Mercado secundario");
            }
        } catch (error) {
            let diferenciaELO = eloA - eloB;
            let expLocal = 1 / (1 + Math.pow(10, -diferenciaELO / 400));
            let expVisit = 1 - expLocal;
            
            let probEmpateBase = 0.28 - (Math.abs(diferenciaELO) * 0.00015);
            if (probEmpateBase < 0.12) probEmpateBase = 0.12; 
            
            mktLocal = expLocal * (1 - probEmpateBase);
            mktVisit = expVisit * (1 - probEmpateBase);
            mktEmpate = probEmpateBase;

            let varianza = (Math.random() * 0.04) - 0.02;
            mktLocal += varianza; mktVisit -= varianza;
        }

        return { eloA, eloB, mktLocal, mktEmpate, mktVisit };
    }

    // --- 2. MOTOR MATEMÁTICO --- //
    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        for (var i = n - 1; i >= 1; i--) { n *= i; }
        return n;
    }

    function poisson(k, lambda) {
        return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }
