<script>
    // --- 1. BASE DE DATOS ELO 48 EQUIPOS --- //
    async function extraerDatos(eqA, eqB) {
        const baseELO = {
            "Alemania": 1980, "Arabia Saudita": 1740, "Argelia": 1820, "Argentina": 2140, "Australia": 1850,
            "Austria": 1860, "Bélgica": 1970, "Bosnia y Herzegovina": 1670, "Brasil": 2080, "Cabo Verde": 1730,
            "Canadá": 1750, "Colombia": 2005, "Corea del Sur": 1880, "Costa de Marfil": 1760, "Croacia": 1990,
            "Curazao": 1600, "Ecuador": 1950, "Egipto": 1790, "Escocia": 1780, "España": 2030,
            "Estados Unidos": 1900, "Francia": 2105, "Ghana": 1680, "Haití": 1610, "Inglaterra": 2040,
            "Irak": 1660, "Irán": 1870, "Japón": 1930, "Jordania": 1640, "Marruecos": 1910,
            "México": 1890, "Noruega": 1830, "Nueva Zelanda": 1650, "Países Bajos": 2020, "Panamá": 1690,
            "Paraguay": 1710, "Portugal": 2015, "Qatar": 1630, "RD Congo": 1620, "República Checa": 1800,
            "Senegal": 1920, "Sudáfrica": 1720, "Suecia": 1840, "Suiza": 1940, "Túnez": 1770,
            "Turquía": 1810, "Uruguay": 2000, "Uzbekistán": 1700
        };

        const eloA = baseELO[eqA];
        const eloB = baseELO[eqB];

        // Normalización del mercado simulada
        let mktLocal = eloA > eloB ? 0.45 : 0.35;
        let mktVisit = eloA > eloB ? 0.30 : 0.40;
        let mktEmpate = 0.25;

        return { eloA, eloB, mktLocal, mktEmpate, mktVisit };
    }

    // --- 2. MOTOR MATEMÁTICO --- //
    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        for (var i = n - 1; i >= 1; i--) { n *= i; }
        return n;
    }

    function poisson(k, lambda) {
        return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }

    async function ejecutarPrediccion() {
        const eqA = document.getElementById('equipoA').value;
        const eqB = document.getElementById('equipoB').value;
        const btn = document.getElementById('btnPredecir');
        const debugPanel = document.getElementById('debugPanel');
        const resultadosDiv = document.getElementById('resultados');

        if (eqA === eqB) {
            alert("Error: Por favor seleccioná dos equipos distintos.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Procesando...";
        resultadosDiv.style.display = 'none';
        
        setTimeout(async () => {
            const datos = await extraerDatos(eqA, eqB);

            // Mostrar ELO
            document.getElementById('debugELO').innerHTML = `<b>Puntos ELO Base:</b><br>${eqA}: ${datos.eloA}<br>${eqB}: ${datos.eloB}`;
            document.getElementById('debugPoly').innerHTML = `<b>Mercado (Limpio):</b><br>${eqA}: ${(datos.mktLocal*100).toFixed(1)}%<br>Empate: ${(datos.mktEmpate*100).toFixed(1)}%<br>${eqB}: ${(datos.mktVisit*100).toFixed(1)}%`;
            debugPanel.style.display = 'block';

            // Cálculo xG
            const eloPromedioTorneo = 1845; // Actualizado al promedio de los 48 equipos
            const golesBase = 1.25;

            let fuerzaOfensivaA = datos.eloA / eloPromedioTorneo;
            let defensaB = eloPromedioTorneo / datos.eloB;
            let xgA = golesBase * fuerzaOfensivaA * defensaB;

            let fuerzaOfensivaB = datos.eloB / eloPromedioTorneo;
            let defensaA = eloPromedioTorneo / datos.eloA;
            let xgB = golesBase * fuerzaOfensivaB * defensaA;

            // Matriz de Poisson
            let probLocalELO = 0, probEmpateELO = 0, probVisitanteELO = 0;
            let maxProbExacta = 0;
            let resExactoA = 0, resExactoB = 0;

            for (let i = 0; i <= 5; i++) {
                for (let j = 0; j <= 5; j++) {
                    let probI = poisson(i, xgA);
                    let probJ = poisson(j, xgB);
                    let probEscenario = probI * probJ;

                    if (i > j) probLocalELO += probEscenario;
                    else if (i === j) probEmpateELO += probEscenario;
                    else probVisitanteELO += probEscenario;

                    if (probEscenario > maxProbExacta) {
                        maxProbExacta = probEscenario;
                        resExactoA = i;
                        resExactoB = j;
                    }
                }
            }

            // Ponderación (Blend)
            const alpha = 0.70; 
            
            let probFinalA = (alpha * datos.mktLocal) + ((1 - alpha) * probLocalELO);
            let probFinalEmpate = (alpha * datos.mktEmpate) + ((1 - alpha) * probEmpateELO);
            let probFinalB = (alpha * datos.mktVisit) + ((1 - alpha) * probVisitanteELO);

            let sumaTotal = probFinalA + probFinalEmpate + probFinalB;
            probFinalA = (probFinalA / sumaTotal) * 100;
            probFinalEmpate = (probFinalEmpate / sumaTotal) * 100;
            probFinalB = (probFinalB / sumaTotal) * 100;

            // Interfaz
            document.getElementById('lblA').innerText = eqA;
            document.getElementById('lblB').innerText = eqB;
            
            document.getElementById('resA').innerText = probFinalA.toFixed(1) + "%";
            document.getElementById('resEmpate').innerText = probFinalEmpate.toFixed(1) + "%";
            document.getElementById('resB').innerText = probFinalB.toFixed(1) + "%";

            document.getElementById('cardA').classList.remove('winner');
            document.getElementById('cardB').classList.remove('winner');

            if (probFinalA > probFinalB) document.getElementById('cardA').classList.add('winner');
            if (probFinalB > probFinalA) document.getElementById('cardB').classList.add('winner');

            document.getElementById('resultadoExacto').innerHTML = `Marcador más probable (Poisson): <br><b>${eqA} ${resExactoA} - ${resExactoB} ${eqB}</b>`;

            btn.innerText = "Calcular Predicción Maestra";
            btn.disabled = false;
            resultadosDiv.style.display = 'block';

        }, 800);
    }
